<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">RewardLens visual audit</title><desc id="d">Controlled visual interventions with base, relevant and irrelevant edits and a 29 point PFC gap.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf0ff"/><stop offset="1" stop-color="#f3efff"/></linearGradient></defs><rect width="1200" height="760" fill="url(#bg)"/><g fill="none" stroke="#9fb5ef" stroke-width="3"><rect x="95" y="220" width="260" height="150" rx="18"/><rect x="735" y="115" width="300" height="150" rx="18"/><rect x="735" y="440" width="300" height="150" rx="18"/><path d="M355 295 C500 295 570 205 735 190"/><path d="M355 295 C500 295 570 505 735 515"/></g><g font-family="Inter,Arial,sans-serif" fill="#17305f"><text x="120" y="250" font-size="22" font-weight="700">BASE IMAGE</text><text x="760" y="145" font-size="22" font-weight="700">RELEVANT EDIT</text><text x="760" y="470" font-size="22" font-weight="700">IRRELEVANT EDIT</text></g><g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#526584" font-size="20"><text x="120" y="330">same question + answers</text><text x="760" y="225">correct choice should flip</text><text x="760" y="550">correct choice should stay</text></g><circle cx="355" cy="295" r="10" fill="#3567e8"/><circle cx="735" cy="190" r="10" fill="#3567e8"/><circle cx="735" cy="515" r="10" fill="#3567e8"/><g font-family="Inter,Arial,sans-serif"><text x="95" y="665" fill="#15213b" font-size="62" font-weight="800">29.0 pt</text><text x="360" y="665" fill="#415376" font-size="30" font-weight="700">PFC gap</text><text x="95" y="705" fill="#6a7892" font-size="22">1.30 pt static-accuracy difference</text></g></svg>