name: Check & Deploy Personal Website

# PR 只做校验；默认分支推送或手动触发才发布。
on:
  pull_request:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "personal-site-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true   # 自动 bundle install + 缓存

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate website code and content
        run: |
          node --check assets/js/main.js
          ruby scripts/check_content_schema.rb
          python3 scripts/validate_content.py
          git diff --check

      - name: Build personal website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site

      - name: Install rsvg-convert (for OG card PNG conversion)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin

      - name: Convert OG SVG cards to PNG
        run: |
          mkdir -p _site/assets/og-cards-png
          for f in _site/assets/og-cards/*.svg; do
            [ -e "$f" ] || continue
            name=$(basename "$f" .svg)
            rsvg-convert -w 1200 -h 630 -o "_site/assets/og-cards-png/${name}.png" "$f"
          done
          echo "Generated $(ls _site/assets/og-cards-png/*.png 2>/dev/null | wc -l) PNG OG cards"

      - name: Build Pagefind search index
        run: |
          npx --yes pagefind@1.5.2 --site _site --output-subdir pagefind
          test -f _site/pagefind/pagefind-ui.js
          test -f _site/pagefind/pagefind-ui.css

      - name: Check rendered routes, project links, and publishing boundaries
        run: node --test tests/*.test.mjs

      - name: Upload verified Pages artifact
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
