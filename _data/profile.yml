research:
  name: RewardLens
  title_zh: 多模态评判模型的视觉证据与行为可靠性
  title_en: Visual evidence and behavioral reliability in multimodal judges
  role_zh: 第一作者
  role_en: First author
  status_zh: ICLR 2027 投稿审稿中
  status_en: Submitted to ICLR 2027 · Under review
  case_url: /projects/rewardlens/
  review_url: https://openreview.net/forum?id=FQ0c7oaccp
  summary_zh: 提出 Behavioral Resolution（行为分辨率）评测，通过受控视觉干预检验模型能否依据关键证据调整判断。评测覆盖 8 个模型、4 类因素、800 组三元组与 2,400 张图像；在空间关系审计原图均答对的五个模型中，相关干预响应差异达 43.5pp。
  summary_en: Proposed Behavioral Resolution, testing whether multimodal judges respond to relevant evidence through controlled image edits. Evaluated eight judges, four factors, 800 triplets, and 2,400 images. Five judges with perfect Spatial audit-base accuracy differed by 43.5pp in relevant-edit adaptation.
