    summary_zh: 主导复杂设备选型智能体从 0 到 1 的架构与落地，连接需求理解、知识检索、业务工具和可恢复的多轮任务。
    summary_en: Led the architecture and delivery of an equipment-selection agent, connecting requirements, retrieval, business tools, and recoverable multi-turn tasks.
    highlights:
      - title_zh: 运行时与委派
        title_en: Runtime and delegation
        text_zh: 基于 DeepAgents / LangGraph 构建主智能体与 4 类专业子智能体，按需求完整度与任务依赖选择工具直调或并行委派，用独立上下文、专属工具集和结构化输出控制协作边界。
        text_en: "Built a DeepAgents / LangGraph supervisor with four specialist types. Routed direct calls or delegation by requirement completeness and dependencies, using isolated contexts, scoped tools, and structured outputs."
      - title_zh: 状态与需求变化
        title_en: State and changing requirements
        text_zh: 以 Pydantic 管理工况、吨位、预算等 6 类字段，采用差量合并与依赖失效传播触发局部重算；离线型号识别与消歧准确率由 80%+ 提升至 90%+。
        text_en: "Modeled six requirement groups in Pydantic. Delta merges and dependency invalidation enable local recomputation; offline equipment-model identification and disambiguation rose from over 80% to over 90%."
      - title_zh: 检索与约束校验
        title_en: Retrieval and constraints
        text_zh: 面向约 4 万条产品及技术资料，结合硬约束过滤、BM25、Qwen3-Embedding-4B、RRF 与 Qwen3-Reranker-4B；离线 Top-5 候选召回率由约 75% 提升至 90%+。
        text_en: "Combined hard filters, BM25, Qwen3 embeddings, RRF, and Qwen3 reranking over roughly 40,000 records. Offline Top-5 candidate recall improved from about 75% to over 90%."
      - title_zh: 工具执行与恢复
        title_en: Governed tools and recovery
        text_zh: 封装产品查询、设备比选、经销商匹配和 CRM 登记四类工具；用 Checkpoint、分类重试、业务唯一键与写入去重恢复任务，避免重复登记线索。
        text_en: "Wrapped four tools for product queries, comparison, dealer matching, and CRM. Checkpoints, classified retries, business keys, and deduplication enable recovery without duplicate leads."
      - title_zh: 轨迹评测与回归
        title_en: Trace evaluation and regression
        text_zh: 在 100+ 多轮售前任务上，结合 LangSmith / Langfuse、规则断言和选型结果定位首次关键失败；同一冻结任务集回归后，端到端成功率由 70%+ 提升至约 85%。
        text_en: "Evaluated over 100 multi-turn tasks with LangSmith / Langfuse traces, rule checks, and failure attribution. Success on a frozen regression set rose from over 70% to about 85%."
