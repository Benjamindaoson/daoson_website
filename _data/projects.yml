  featured_order: 4
  home_featured: true
  home_order: 3
  case_url: /projects/startshift-vla/
  eyebrow_zh: "机器人策略可靠性"
  eyebrow_en: "Robot-policy reliability"
  summary_zh: "研究 SmolVLA 的初始化敏感性，保留 920 条历史仿真评估记录。两组任务未配对，改进方法尚未验证。"
  summary_en: "Study SmolVLA initialization sensitivity through 920 saved simulation records. Task selections are unpaired; mitigation remains unvalidated."
