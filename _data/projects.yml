- name_zh: "RewardLens"
  name_en: "RewardLens"
  domain: digital
  display_status_zh: "多模态研究"
  display_status_en: "Multimodal research"
  home_featured: true
  home_order: 2
  id: rewardlens
  home_purpose_zh: "模型真的在看图吗？固定问题和答案选项，只改变画面中的一个因素，检查模型是否跟随了正确的变化。"
  home_purpose_en: "Is the model reading the image? Keep the question and answer choices fixed, change one visual factor, and check whether its response changes for the right reason."
  evidence_kind_zh: "静态同分下的行为差异"
  evidence_kind_en: "Behavior at a static-accuracy tie"
  metric_context_zh: "Attribute：两模型静态准确率均为 80.5%；RA 分别按各自原图正确子集计算。此汇总对比与上面的 Molmo 单例使用不同模型。"
  metric_context_en: "Attribute: both judges score 80.5% static accuracy; RA uses each judge’s own base-correct subset. This aggregate comparison uses different models from the Molmo example above."
  featured: true
  featured_order: 3
  case_url: /projects/rewardlens/
  eyebrow_zh: "多模态模型评估"
  eyebrow_en: "Multimodal evaluation"
  summary_zh: "固定问题和候选回答，只改变视觉证据；用 8 个模型、4 类因素检验静态分数相近时的干预行为差异。"
  summary_en: "Hold questions and responses fixed, edit visual evidence, and compare intervention behavior across eight judges and four factors."
  metric_label_zh: "Attribute 静态平分下的 RA 差异"
  metric_label_en: "RA gap at an exact Attribute static tie"
  metric_value: "15.1 pp"
  image: /assets/images/projects/rewardlens-evidence.svg
  image_compact: /assets/images/projects/rewardlens-evidence-compact.svg
  image_alt_zh: "Attribute 条件下，两模型独立静态准确率均为 80.5%；Phi-3.5-Vision 的 RA 为 84.95%，LLaVA-OneVision-7B 为 100%。RA 使用各模型自己的原图正确子集。"
  image_alt_en: "On Attribute, both judges have 80.5% independent static accuracy; RA is 84.95% for Phi-3.5-Vision and 100% for LLaVA-OneVision-7B, using each model’s base-correct subset."
  description_zh: "多模态评判模型的受控视觉审计：区分相关变化后的适应能力与无关变化下的稳定性。"
  description_en: "A controlled visual audit that separates adaptation to relevant changes from invariance to irrelevant changes."
  icon: "◎"
  status: prototype
  portfolio_group: research
  category: ai
  url: "https://github.com/Benjamindaoson/RewardLens"
  lang: "Python"
  year: 2026
  public_boundary_zh: "公开论文、实验代码与结果工件；结论限于冻结的评估设置，不表示会议录用或通用模型排名。"
  public_boundary_en: "Public manuscript, code, and result artifacts; findings apply to the frozen evaluation setting, not a universal model ranking."

