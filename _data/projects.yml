  image_alt_en: "Historical SmolVLA simulation baselines: ID succeeds in 86/120 episodes (71.67%); RobotInit in 36/800 (4.50%). Tasks and scenes are unpaired; this is not a reset-only causal estimate."
  description_zh: "关于 VLA 策略初始化敏感性的研究归档，保留仿真基线、证据复核工具和未完成部分。"
