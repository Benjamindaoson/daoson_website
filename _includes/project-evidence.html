{% assign evidence_project = site.data.projects | where: "id", include.project_id | first %}
{% if evidence_project.image %}
<figure class="case-cover{% if evidence_project.image_compact %} has-compact-evidence{% endif %}">
  <picture>{% if evidence_project.image_compact %}<source media="(max-width: 640px)" srcset="{{ evidence_project.image_compact | relative_url }}" width="420" height="330">{% endif %}<img src="{{ evidence_project.image | relative_url }}" alt="{{ evidence_project.image_alt_zh | escape }}" data-alt-zh="{{ evidence_project.image_alt_zh | escape }}" data-alt-en="{{ evidence_project.image_alt_en | escape }}" width="1200" height="760" loading="lazy"></picture>
  <figcaption><span class="i18n i18n-zh">{{ evidence_project.image_alt_zh }}</span><span class="i18n i18n-en">{{ evidence_project.image_alt_en }}</span></figcaption>
</figure>
{% endif %}
